<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新标签页</title>
<link rel="icon" href="/icons/newtab-favicon.png">
<script src="boot.js"></script>
<link rel="stylesheet" href="style.css">
<script src="site-icons.js" defer></script>
<script src="query-analyzer.js" defer></script>
<script src="suggestion-usage.js" defer></script>
<script src="site-search.js" defer></script>
<script src="newtab.js" defer></script>
<script src="bookmarks.js" defer></script>
</head>
<body>
<img id="wallpaper" class="wallpaper" alt="" aria-hidden="true">
<img id="wallpaper-previous" class="wallpaper wallpaper-previous" alt="" aria-hidden="true">
<div class="focus-halo" aria-hidden="true"></div>

<button id="open-bookmarks" class="bookmark-toggle glass-button" type="button" aria-expanded="false" aria-controls="bookmark-sidebar" aria-label="展开书签侧边栏" title="展开书签侧边栏">
  <svg class="sidebar-layout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.8" y="4.5" width="16.4" height="15" rx="2.8"/><path d="M9.1 4.8v14.4"/></svg>
</button>

<aside id="bookmark-sidebar" class="glass-panel bookmark-sidebar" aria-hidden="true" aria-label="书签导航">
  <header class="sidebar-heading safari-header">
    <button id="bookmark-back" type="button" class="safari-round-icon" aria-label="返回" title="返回">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg>
    </button>
    <h2 id="bookmark-current-title">书签</h2>
    <button id="bookmark-close" type="button" class="safari-round-icon" aria-label="收起书签侧边栏" title="收起书签侧边栏" aria-controls="bookmark-sidebar">
      <svg class="sidebar-layout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.8" y="4.5" width="16.4" height="15" rx="2.8"/><path d="M9.1 4.8v14.4"/></svg>
    </button>
  </header>
  <div class="bookmark-search glass-field">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 5 5"/></svg>
    <input id="bookmark-query" type="search" autocomplete="off" spellcheck="false" placeholder="搜索“书签”" data-i18n-placeholder="bookmarkPlaceholder" aria-label="搜索书签">
    <button id="clear-bookmark-query" type="button" class="clear-search safari-clear" hidden aria-label="清除搜索">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 6.5 11 11m0-11-11 11"/></svg>
    </button>
  </div>
  <nav id="bookmark-tree" class="bookmark-tree" aria-label="书签目录"><p class="empty-note">点击文件夹进入</p></nav>
</aside>


<main id="main" class="main">
  <section class="search-area" aria-label="搜索">
    <div class="search-combo">
      <form id="search-form" class="glass-panel search-bar" autocomplete="off" role="search">
        <div id="engine-control" class="engine-control">
          <button id="engine-button" class="engine-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="engine-menu" aria-label="切换搜索引擎" title="选择搜索引擎">
            <img id="engine-icon" src="assets/google.ico" alt="" width="21" height="21">
            <span id="engine-name">Google</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="chevron"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <button id="exit-site-search" class="site-scope-exit" type="button" aria-label="退出站内搜索" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10m0-10L7 17"/></svg></button>
          <div id="engine-menu" class="engine-menu" role="menu" aria-hidden="true" inert>
            <button type="button" role="menuitemradio" aria-checked="true" data-engine="google"><img src="assets/google.ico" alt=""><span>Google</span><svg class="selected-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5 10 17l8.5-9"/></svg></button>
            <button type="button" role="menuitemradio" aria-checked="false" data-engine="bing"><img id="bing-menu-icon" src="assets/bing.ico" alt=""><span>Bing</span><svg class="selected-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5 10 17l8.5-9"/></svg></button>
            <button type="button" role="menuitemradio" aria-checked="false" data-engine="baidu"><img src="assets/baidu.ico" alt=""><span>Baidu</span><svg class="selected-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5 10 17l8.5-9"/></svg></button>
          </div>
        </div>
        <div class="query-field">
          <input id="query" type="search" autocomplete="off" spellcheck="false" placeholder="搜索或输入 Web 地址" data-i18n-placeholder="searchPlaceholder" aria-label="搜索或输入 Web 地址" aria-autocomplete="both" aria-expanded="false" aria-controls="search-suggestions" aria-describedby="completion-help">
          <div id="query-completion" class="query-completion" aria-hidden="true" hidden><span class="completion-prefix"></span><span class="completion-suffix"></span></div>
        </div>
        <button class="search-round-button search-submit" type="submit" aria-label="搜索" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </form>
      <div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="搜索建议" aria-hidden="true" hidden></div>
      <div id="suggestion-keyboard-help" class="suggestion-keyboard-help" aria-hidden="true">
        <span><kbd>Tab</kbd><span data-i18n="cycleHint">切换建议</span></span>
        <span id="completion-key-hint" hidden><kbd>→</kbd><span data-i18n="completeHint">补全</span></span>
        <span><kbd>Enter</kbd><span id="confirm-hint-label" data-i18n="confirmHint">确认</span></span>
        <span id="site-search-key-hint" hidden><kbd>@</kbd><span data-i18n="siteHint">站内搜索</span></span>
        <span id="dismiss-key-hint"><kbd>Esc</kbd><span id="dismiss-hint-label" data-i18n="dismissHint">收起</span></span>
      </div>
      <p id="site-search-notice" class="site-search-notice" role="status" hidden></p>
      <span id="completion-help" class="sr-only" data-i18n="completionHelp">Tab 下一条，Shift+Tab 上一条，右方向键接受补全，Enter 确认，Esc 收起建议</span>
    </div>
  </section>
</main>
<p id="credit" class="credit" hidden></p>

<button id="open-settings" class="settings-toggle glass-button" type="button" aria-expanded="false" aria-controls="settings" aria-label="设置" title="设置">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
</button>
<aside id="settings" class="glass-panel settings-panel" aria-hidden="true" aria-label="设置">
<header class="settings-heading"><h2 data-i18n="settings">设置</h2><button id="close-settings" type="button" class="subtle-button" aria-label="关闭设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12m0-12L6 18"/></svg></button></header>
<div class="language-row"><span class="language-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span class="row-name" data-i18n="language">语言</span></span><div id="locale-segmented" class="segmented" data-selected="zh" role="group" aria-label="界面语言"><span class="segment-thumb" aria-hidden="true"></span><button type="button" data-locale="zh" class="active" aria-pressed="true">中</button><button type="button" data-locale="en" aria-pressed="false">EN</button></div></div>
<label class="suggest-pref-row"><span data-i18n="onlineSuggestions">在线搜索建议</span><input id="online-suggestions" type="checkbox" checked><span class="suggest-toggle-track" aria-hidden="true"><span class="suggest-toggle-thumb"></span></span></label>
<button id="open-wallpapers" type="button" class="wallpaper-entry action-button"><span data-i18n="background">背景</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
<p id="status" role="status" aria-live="polite" class="status"></p>
</aside>
<dialog id="wallpaper-manager" class="wallpaper-manager glass-panel" aria-labelledby="wallpaper-title">
<header class="settings-heading"><h2 id="wallpaper-title" data-i18n="background">背景</h2><button id="close-wallpapers" type="button" class="subtle-button" data-i18n-aria="closeWallpapers" aria-label="关闭背景配置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12m0-12L6 18"/></svg></button></header>
<div id="background-options" class="mode-group wallpaper-grid" role="group" aria-labelledby="wallpaper-title">
<label class="mode-card wallpaper-option wallpaper-mode mode-auto"><input type="radio" name="mode" value="auto"><span class="background-preview" aria-hidden="true"><span class="mode-icon"><svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="3.4"/><path d="M7 1.5v1M7 11v1.5M1.5 7h1M11.5 7h1M3.1 3.1l.8.8M10.1 10.1l.8.8M3.1 10.9l.8-.8"/><path d="M16 4.5a7.5 7.5 0 1 0 3.6 14.4A8.5 8.5 0 0 1 16 4.5Z"/></svg></span></span><span class="background-name" data-i18n="auto">自动跟随系统</span><span class="mode-selection" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg></span></label>
<label class="mode-card wallpaper-option wallpaper-mode mode-white"><input type="radio" name="mode" value="white"><span class="background-preview" aria-hidden="true"><span class="mode-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span></span><span class="background-name" data-i18n="white">纯白</span><span class="mode-selection" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg></span></label>
<label class="mode-card wallpaper-option wallpaper-mode mode-black"><input type="radio" name="mode" value="black"><span class="background-preview" aria-hidden="true"><span class="mode-icon"><svg viewBox="0 0 24 24"><path d="M20.4 15.3A8.7 8.7 0 0 1 8.7 3.6 8.8 8.8 0 1 0 20.4 15.3Z"/></svg></span></span><span class="background-name" data-i18n="black">纯黑</span><span class="mode-selection" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg></span></label>
<label class="mode-card wallpaper-option wallpaper-mode mode-bing"><input type="radio" name="mode" value="bing"><span class="background-preview" aria-hidden="true"><img id="bing-preview" class="bing-preview" alt="" hidden><span class="mode-icon"><img src="assets/bing.ico" alt=""></span></span><span class="background-name" data-i18n="daily">必应每日背景</span><span class="mode-selection" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg></span></label>
<div id="wallpaper-grid" class="wallpaper-user-grid"></div>
<button type="button" class="wallpaper-option builtin-wallpaper" data-builtin="alpine" data-id="builtin:alpine" aria-pressed="false"><img src="assets/backgrounds/alpine.webp" alt="" class="background-preview"><span class="background-name" data-i18n="alpine">雪山晨光</span><span class="mode-selection" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg></span></button>
<button type="button" class="wallpaper-option builtin-wallpaper" data-builtin="aurora" data-id="builtin:aurora" aria-pressed="false"><img src="assets/backgrounds/aurora.webp" alt="" class="background-preview"><span class="background-name" data-i18n="aurora">极光之夜</span><span class="mode-selection" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg></span></button>
<button type="button" class="wallpaper-option builtin-wallpaper" data-builtin="dunes" data-id="builtin:dunes" aria-pressed="false"><img src="assets/backgrounds/dunes.webp" alt="" class="background-preview"><span class="background-name" data-i18n="dunes">流金沙丘</span><span class="mode-selection" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg></span></button>
<button type="button" class="wallpaper-option builtin-wallpaper" data-builtin="coast" data-id="builtin:coast" aria-pressed="false"><img src="assets/backgrounds/coast.webp" alt="" class="background-preview"><span class="background-name" data-i18n="coast">静谧海岸</span><span class="mode-selection" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg></span></button>
</div>
<footer class="background-footer">
<div class="background-meta"><span id="background-count"></span><div id="bing-details" class="bing-details" hidden><p id="bing-status" role="status" aria-live="polite"></p><button id="retry-bing" type="button" class="safari-round-icon background-tool" data-i18n="retry">重试更新</button></div></div>
<div class="background-tools"><button id="manage-wallpapers" class="safari-round-icon background-tool" type="button" data-i18n="manage" aria-pressed="false">管理</button><button id="choose-image" class="safari-round-icon background-tool" type="button" title="支持多选，每张不超过 20MB"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.3" cy="9" r="1.4"/><path d="m4 17 5-5 3.4 3.4 3.1-3.1L21 18"/></svg><span data-i18n="addImages">添加图片</span></button></div>
</footer>
<div class="background-batch-shell"><div id="wallpaper-batch" class="wallpaper-batch" aria-hidden="true" inert><div class="wallpaper-batch-content"><button id="select-all-wallpapers" type="button" class="safari-round-icon background-tool" data-i18n="selectAll">全选</button><span id="wallpaper-selection-count" role="status"></span><button id="delete-wallpapers" type="button" class="safari-round-icon background-tool danger" disabled data-i18n="deleteSelected">删除所选</button></div></div></div>
<input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/avif,image/gif" multiple hidden>
<p id="wallpaper-status" role="status" aria-live="polite" class="status"></p>
</dialog>
</body>
</html>
