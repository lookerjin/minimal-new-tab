name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies and browser
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Check JavaScript and unit tests
        run: |
          for file in *.js; do node --check "$file"; done
          node --test tests/search-core.test.cjs
      - name: Browser integration tests
        run: |
          for file in tests/test_*.py; do
            echo "::group::$file"
            timeout 240s python -m pytest -q "$file"
            echo "::endgroup::"
          done
      - name: Verify release package
        run: python scripts/package.py
      - name: Upload validated ZIP
        uses: actions/upload-artifact@v4
        with:
          name: edge-extension-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
