name: "Feature request / 功能建议"
description: "Suggest an improvement / 提出改进建议"
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: "要解决的问题 / Problem to solve"
      description: "描述真实使用场景，而不仅是想添加的按钮。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "建议方案 / Proposal"
      description: "期望的行为是什么？有无最小可验证方案？"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案与约束 / Alternatives and constraints"
      description: "列出其他可行方式、成本、权限或兼容性限制。"
